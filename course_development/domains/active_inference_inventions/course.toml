[course]
id = "ai-inventions"
title = "Active Inference for Inventions"
description = "Domain-specific Active Inference curriculum applying the Free Energy Principle to invention and innovation"
version = "1.0.0"
level = "domain"

[course.structure]
sections = 4
modules_per_section = 8
total_modules = 32

[course.sections]
names = [
    "01_invention_foundations",
    "02_creative_engineering",
    "03_prototyping_and_testing",
    "04_innovation_ecosystems",
]

[course.modules]
spine = [
    "01_systems",
    "02_agents",
    "03_perception",
    "04_cognition",
    "05_action",
    "06_learning",
    "07_communication",
    "08_planning",
]

[course.outputs]
formats = ["md", "html", "docx", "pdf", "txt"]

[course.metadata]
domain = "inventions"
audience = "All backgrounds — engineers, artists, entrepreneurs, scientists, students"
prerequisites = "None"
