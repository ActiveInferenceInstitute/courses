# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.3.0
  updated: '2026-11-11'
repo:
  name: courses
  slug: courses
  full_name: ActiveInferenceInstitute/courses
  description: Welcome to the open-source curriculum infrastructure for Active Inference
    education. This repository hosts 14 complete courses spanning Kindergarten to
    PhD (plus a YouTube transcript archive and a GNN syntax track — 20 total entries
    in COURSE_REGISTRY), powered by a modular Python publishing engine.
institute:
  category: education
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  - repo: ActiveInferenceInstitute/Active_Inference_Ontology
    relation: references
    note: Uses Active Inference Ontology terms.
  - repo: ActiveInferenceInstitute/ActiveInferenceJournal
    relation: referenced-by
    note: Featured in Institute materials.
  links:
    github: https://github.com/ActiveInferenceInstitute/courses
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: LICENSE
  kind: doc
  description: License.
- path: CHANGELOG.md
  kind: doc
  description: Changelog.
- path: publish.py
  kind: code
  description: Top-level pipeline entry point driven by publish.toml.
- path: publish.toml
  kind: metadata
  description: Publishing configuration for courses, formats and pipeline options.
- path: course_development/
  kind: source
  description: Markdown source for every course and module.
- path: software/
  kind: code
  description: Python rendering engine (21 modules, 23 CLI scripts, tests and docs).
- path: published/
  kind: publication
  description: Rendered course outputs produced by the pipeline.
provenance:
  license: CC-BY-4.0
  citation:
    text: Active Inference Institute — courses.
instituteos:
  tags:
  - courses
  - education
  - learning
  - active-inference
  - html
capabilities:
- tested
- ci
tasks:
  inventory:
    cmd: git ls-files
    description: List tracked files.
  test:
    cmd: uv run pytest tests/ -m "not requires_internet and not requires_api and not requires_whisper"
    cwd: software
    description: Run the offline test suite the CI gate uses.
docs:
- README.md
- AGENTS.md
- docs/INTEGRATION.md
- docs/README.md
- docs/AGENTS.md
schema: aii-sidecar/v1
