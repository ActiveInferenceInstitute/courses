name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: software
        run: uv sync --extra dev

      - name: Ruff lint
        working-directory: software
        run: uv run ruff check src/ scripts/ --output-format=github

      - name: Ruff format check
        working-directory: software
        run: uv run ruff format --check src/ scripts/

      - name: mypy type check
        working-directory: software
        run: uv run mypy src/

  verify-no-mocks:
    name: Verify No Mocks Policy
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Run no-mocks verification
        run: |
          python scripts/verify_no_mocks.py
        working-directory: software

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: verify-no-mocks
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: software
        run: uv sync --extra dev

      - name: Run tests
        working-directory: software
        run: |
          uv run pytest tests/ \
            -v \
            -m "not requires_internet and not requires_api and not requires_whisper" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: software/coverage.xml
          fail_ci_if_error: false
