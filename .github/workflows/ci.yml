name: CI

# Every check below is one `./run.sh` arm. The arms are the same commands a
# contributor runs locally (docs/RUN_GUIDE.md); this workflow adds no second
# copy of a command, so a green local arm and a green CI step cannot diverge.
#
# Jobs are independent: no `needs:` chain, so one slow arm does not delay the
# others. Each job syncs the environment once and then runs its arms in it.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Hosted runs must not append to the tracked timing receipts.
  GATE_TIMINGS: "0"

jobs:
  static:
    name: Static checks (lint, types, no-mocks, docs, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: software
        run: uv sync --extra dev

      - name: Lint (ruff check + format check)
        run: ./run.sh lint

      - name: Types (mypy)
        run: ./run.sh types

      - name: No-mocks policy
        run: ./run.sh no-mocks

      - name: Docs (relative links + generated facts)
        run: ./run.sh docs

      - name: Education contract (schema, member copies, bundle freshness)
        run: ./run.sh contract

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: software
        run: uv sync --extra dev

      - name: Offline test gate
        run: ./run.sh test

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: software/coverage.xml
          fail_ci_if_error: false

  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # The arm creates its own seeded venv and installs the parser pinned in
      # .github/gnn-pin.json; nothing else in the repository needs that package.
      - name: GNN conformance (pin, parse, type-check)
        run: ./run.sh gnn
